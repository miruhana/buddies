<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buddies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 高齢の方の読みやすさを優先し、明るい1テーマに固定しています */
:root{
  color-scheme: light;
  --ink:#1F1B24; --ink2:#3F3947; --paper:#FFFDF8; --card:#FFFFFF; --line:#D8D0C4;
  --tint:#EFEBFB; --tint2:#E2DBF7; --accent:#46369A; --soft:#CFC6F0;
  --danger:#9E1B14; --dangerbg:#FDECEA; --ok:#1B5E3A; --warnbg:#FFF4D6;
  --fs:20px;
  --r:18px;
  --disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{background:var(--tint);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.7;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #F5B82E;outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

/* 上のバー：左上「もどる」、右上「最初から」 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--tint);display:grid;grid-template-columns:auto 1fr auto;min-height:80px;align-items:center;gap:8px;padding-block:10px;border-bottom:2px solid var(--tint2)}
.brand{font-family:var(--disp);font-weight:900;font-size:1.35rem;letter-spacing:.02em;color:var(--accent);grid-column:1 / 3}
.ptitle{font-family:var(--disp);font-weight:900;font-size:1.3rem;line-height:1.35;margin:16px 0 0;text-wrap:balance}
.navbtn{min-height:60px;min-width:84px;padding:6px 12px;border-radius:14px;border:2.5px solid var(--ink2);background:var(--card);font-family:var(--disp);font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1.2}
.navbtn svg{width:22px;height:22px;flex:none}
.navbtn.ghost{visibility:hidden}

/* キャラクター（いただいたイラストをそのまま使用） */
.chr{display:block;width:100%;height:100%}
.chr img{display:block;width:100%;height:100%;object-fit:contain;transform-origin:50% 92%;animation:squish 3.2s ease-in-out infinite;-webkit-user-drag:none;user-select:none}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
.talking .chr img{animation:talk .42s ease-in-out infinite}
@keyframes talk{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(.98,1.03)}}
.m-happy img{animation:hop .6s ease-out 2, squish 3.2s ease-in-out 1.2s infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.m-surprise img{animation:jump .5s cubic-bezier(.3,1.6,.5,1), squish 3.2s ease-in-out .5s infinite}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
.m-cheer img{animation:cheer .5s ease-in-out 3, squish 3.2s ease-in-out 1.5s infinite}
@keyframes cheer{0%,100%{transform:scale(1,1)}50%{transform:scale(1.07,.93)}}
.m-tilt img{animation:tilt 1.4s ease-in-out, squish 3.2s ease-in-out 1.4s infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-8deg)}}
.m-sleep img{animation:sleep 3.6s ease-in-out infinite;opacity:.9}
@keyframes sleep{0%,100%{transform:rotate(0) scale(1,1)}50%{transform:rotate(3deg) scale(1.02,.97)}}
@media (prefers-reduced-motion:reduce){.chr img,.talking .chr img,.ring{animation:none!important}}

.hero{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;margin-top:16px}
.hero.big{grid-template-columns:150px 1fr}
.hero .who{width:100%;aspect-ratio:1;background:none;border:0;padding:0}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--ink2);border-radius:22px;padding:14px 16px;font-size:1.05rem;line-height:1.65}
.bubble::before{content:"";position:absolute;left:-13px;top:calc(50% - 10px);border:10px solid transparent;border-right:12px solid var(--ink2);border-left:0}
.bubble::after{content:"";position:absolute;left:-9px;top:calc(50% - 8px);border:8px solid transparent;border-right:10px solid var(--card);border-left:0}
.bubble .say{margin:0}
.bubble .name{display:block;font-family:var(--disp);font-weight:700;font-size:.8rem;color:var(--accent);margin-bottom:2px}
@media (max-width:420px){.hero{grid-template-columns:96px 1fr;gap:10px}.hero.big{grid-template-columns:120px 1fr;gap:10px}.bubble{font-size:1rem;padding:12px 14px}.navbtn{min-width:0}}

/* ボタン */
.stack{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.btn{min-height:64px;border-radius:var(--r);border:3px solid var(--ink2);background:var(--card);font-family:var(--disp);font-weight:700;font-size:1.05rem;padding:10px 18px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.35;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{min-height:60px;font-size:.9rem;padding:8px 12px}
.btn svg{width:28px;height:28px;flex:none}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.bigbtn{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:14px;min-height:104px;padding:14px 18px;border-radius:24px;background:var(--accent);color:#fff;border:0;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.bigbtn .ic{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center}
.bigbtn .ic svg{width:36px;height:36px}
.bigbtn b{display:block;font-family:var(--disp);font-size:1.4rem;line-height:1.2}
.bigbtn span{font-size:.88rem;opacity:.95}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}

h2.sec{font-family:var(--disp);font-size:1.2rem;margin:30px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:104px;border-radius:var(--r);background:var(--card);border:2.5px solid var(--soft);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:12px 14px;text-align:left;font-family:var(--disp);font-weight:700;font-size:.95rem;line-height:1.3}
.tile .ti{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.tile .ti svg{width:26px;height:26px}
.tile.alert{border-color:#E7A29C}
.tile.alert .ti{background:var(--dangerbg);color:var(--danger)}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{min-height:72px;border-radius:var(--r);background:var(--card);border:2.5px solid var(--soft);display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 14px;text-align:left;font-family:var(--disp);font-weight:700}
.lrow svg{width:30px;height:30px;color:var(--accent)}
.lrow .chr{width:100%;height:100%}
.lrow small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--ink2)}
.lrow .go{font-size:.85rem;color:var(--ink2)}

/* 用語 */
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent);cursor:pointer}

/* 一歩ずつ案内 */
.stepmeta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:.85rem;color:var(--ink2)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.stepno{font-family:var(--disp);font-weight:700;font-size:1.05rem;color:var(--ink)}
.altbox{margin-top:10px;background:var(--warnbg);border-radius:12px;padding:10px 12px;font-size:.95rem}
.altbox b{font-family:var(--disp)}
.mock{margin:18px auto 0;width:min(210px,62%);aspect-ratio:9/16;border:4px solid var(--ink2);border-radius:28px;background:#F4F2EE;position:relative;padding:22px 10px 16px;display:grid;grid-template-rows:1fr 1fr 1fr;gap:8px}
.mock::before{content:"";position:absolute;top:8px;left:calc(50% - 22px);width:44px;height:6px;border-radius:3px;background:var(--ink2)}
.mock .band{border-radius:10px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 6px}
.mock .band i{display:block;height:9px;border-radius:5px;background:#DDD8CF}
.mock .band i:nth-child(2){width:70%}
.mock .hit{position:relative;background:#fff;border:3px solid var(--accent);border-radius:10px;padding:6px 6px;font-family:var(--disp);font-weight:700;font-size:.72rem;line-height:1.25;text-align:center;word-break:break-all}
.ring{position:absolute;inset:-9px;border:4px solid #E4574B;border-radius:14px;animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:1;transform:scale(.95)}100%{opacity:0;transform:scale(1.15)}}
.mockcap{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:6px}
.linkrow{display:flex;gap:10px;margin-top:12px}
.linkrow .btn{flex:1}

/* カード・注意 */
.card{background:var(--card);border-radius:var(--r);border:2.5px solid var(--soft);padding:16px;margin-top:16px}
.card h3{margin:0 0 6px;font-family:var(--disp);font-size:1.1rem}
.warn{background:var(--dangerbg);border:3px solid var(--danger);border-radius:var(--r);padding:16px;margin-top:16px}
.warn h3{margin:0 0 8px;color:var(--danger);font-family:var(--disp);font-size:1.25rem;line-height:1.4}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rules div{background:var(--card);border:2.5px solid var(--danger);border-radius:14px;text-align:center;padding:10px 2px;font-family:var(--disp);font-weight:900;color:var(--danger);font-size:.85rem;line-height:1.3;white-space:nowrap;display:grid;place-items:center}
.note{background:var(--warnbg);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:.92rem}
ol.pts,ul.pts{margin:8px 0 0;padding-left:1.4em}
ol.pts li,ul.pts li{margin:6px 0}
.okmark{font-family:var(--disp);font-weight:900;color:var(--ok)}

/* フォーム */
label.lb{display:block;font-family:var(--disp);font-weight:700;margin:16px 0 6px}
.inp{width:100%;min-height:60px;border-radius:14px;border:2.5px solid var(--ink2);background:#fff;padding:10px 14px;font-size:1rem}
textarea.inp{min-height:130px;line-height:1.6;resize:vertical}
.hint{font-size:.85rem;color:var(--ink2);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:52px;border-radius:26px;border:2px solid var(--soft);background:#fff;padding:6px 16px;font-size:.9rem}
/* 会話のやりとり（自分は右、相棒は左） */
.chatlog{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.cmsg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:.95rem;line-height:1.6;overflow-wrap:anywhere}
.cmsg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.cmsg.ai{align-self:flex-start;background:var(--card);border:2px solid var(--soft);border-bottom-left-radius:6px}
.cmsg.ai b{display:block;font-family:var(--disp);font-size:.85rem;color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{min-height:64px;border-radius:14px;border:2.5px solid var(--soft);background:#fff;font-family:var(--disp);font-weight:700;line-height:1.25;padding:6px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}

/* キャラえらび */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ccard{border-radius:20px;border:3px solid transparent;padding:10px 8px 12px;text-align:center;font-family:var(--disp);font-weight:700;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:4px}
.ccard .pic{width:110px;height:110px}
.ccard small{font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--ink2)}
.ccard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset}
.ccard .sel{white-space:nowrap;font-size:.72rem;background:var(--ink);color:#fff;border-radius:10px;padding:1px 10px;visibility:hidden}
.ccard[aria-pressed="true"] .sel{visibility:visible}
.exrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.exrow button{border:2px solid var(--soft);background:#fff;border-radius:14px;padding:4px 2px 6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;min-height:60px}
.exrow button span.p{width:100%;aspect-ratio:1;display:block}

/* 写真 */
.photo{position:relative;margin-top:16px;border-radius:16px;overflow:hidden;border:3px solid var(--ink2);background:#000}
.photo img{display:block;width:100%;max-height:420px;object-fit:contain}
.photo .spot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:5px solid #FF4D3D;border-radius:50%;box-shadow:0 0 0 3px #fff}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* 考え中 */
.think{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;margin-top:18px;justify-content:center}
.think i{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

/* サブスク一覧 */
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--card);border-radius:var(--r);border:3px solid var(--accent);padding:14px 16px;margin-top:16px}
.total b{font-family:var(--disp);font-size:1.7rem;font-variant-numeric:tabular-nums}
.sitem{background:var(--card);border-radius:var(--r);border:2.5px solid var(--soft);padding:14px 16px}
.sitem .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sitem .nm{font-family:var(--disp);font-weight:700;font-size:1.1rem}
.sitem .pr{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.sitem .dt{font-size:.9rem;color:var(--ink2)}
.sitem .row2{margin-top:10px}

.hist{background:var(--card);border-radius:var(--r);border:2.5px solid var(--soft);padding:12px 16px;display:grid;gap:6px}
.hist .d{font-size:.85rem;color:var(--ink2)}
.hist .t{font-family:var(--disp);font-weight:700;font-size:1.1rem}

.bigtel{font-family:var(--disp);font-weight:900;font-size:1.8rem;letter-spacing:.04em;user-select:all;font-variant-numeric:tabular-nums}
.msgbox{background:#fff;border:2px dashed var(--ink2);border-radius:14px;padding:12px;white-space:pre-wrap;user-select:all}

/* 下から出る説明 */
.scrim{position:fixed;inset:0;background:rgba(20,16,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--paper);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-family:var(--disp);font-size:1.25rem}
.sheet .big{font-size:1.15rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 20px;z-index:60;font-family:var(--disp);font-weight:700}
.foot{margin-top:28px;font-size:.82rem;color:var(--ink2);text-align:center;line-height:1.6}
.pill{display:inline-block;background:var(--card);border:2px solid var(--soft);border-radius:999px;padding:2px 12px;font-size:.85rem}
.center{text-align:center}
.mt{margin-top:16px}
p{margin:0 0 .6em}
/* LINE風の画面イメージ */
.lm{position:relative;margin:18px auto 0;width:min(250px,76%);aspect-ratio:9/17;border:5px solid var(--ink2);border-radius:30px;background:#fff;overflow:hidden;display:flex;flex-direction:column;font-family:var(--body);font-size:11px;line-height:1.3;color:#222}
.lm svg{width:18px;height:18px;display:block}
.lm-top{display:flex;align-items:center;gap:6px;padding:14px 8px 7px;background:#fff;border-bottom:1px solid #e6e6e6}
.lm-top b{flex:1;font-size:12px}
.lm-top.plain b{font-size:13px}
.lm-ic{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:#333;flex:none}
.lm-ic.in{width:22px;height:22px;margin-left:auto}
.lm-ic.send{color:#06A840}
.lm-ic.round{background:#06C755;color:#fff;border-radius:50%;width:34px;height:34px}
.lm-hl{position:relative;z-index:2;outline:3px solid #E4574B;outline-offset:2px;border-radius:8px;animation:lmhl 1.3s ease-in-out infinite;background:#FFF1EF}
.lm-ic.round.lm-hl,.lm-end.lm-hl{background:inherit}
@keyframes lmhl{0%,100%{outline-color:#E4574B}50%{outline-color:#FFB1A8}}
@media (prefers-reduced-motion:reduce){.lm-hl{animation:none}}
.lm-msgs{flex:1;background:#9BB9DB;padding:10px 8px;display:flex;flex-direction:column;gap:6px;position:relative}
.lm-msgs.short{flex:0 0 auto;min-height:70px}
.lm-b{max-width:78%;padding:6px 9px;border-radius:14px;background:#fff}
.lm-b.me{align-self:flex-end;background:#8DE055}
.lm-read{align-self:flex-end;font-size:9px;color:#34465e}
.lm-input{display:flex;align-items:center;gap:2px;padding:6px 6px 10px;background:#fff;border-top:1px solid #e6e6e6}
.lm-field{flex:1;display:flex;align-items:center;min-height:28px;background:#F1F1F1;border-radius:14px;padding:0 4px 0 9px;color:#222}
.lm-field em{color:#999;font-style:normal}
.lm-field.solo{margin:14px 10px;flex:none;border-bottom:2px solid #06C755;border-radius:6px}
.lm-cursor{width:1.5px;height:14px;background:#06C755;margin-left:2px}
.lm-tabs{display:flex;justify-content:space-around;padding:6px 2px 10px;border-top:1px solid #e6e6e6;background:#fff}
.lm-tab{display:flex;flex-direction:column;align-items:center;gap:1px;color:#999;padding:2px 4px}
.lm-tab.act{color:#111}
.lm-tab i{font-style:normal;font-size:8.5px}
.lm-list{flex:1;display:flex;flex-direction:column}
.lm-row{display:flex;gap:8px;align-items:center;padding:8px 9px;border-radius:8px}
.lm-row b{display:block;font-size:11.5px}
.lm-row small{color:#888;font-size:9.5px}
.lm-sec{padding:6px 9px 2px;color:#888;font-size:9.5px}
.lm-av{width:30px;height:30px;border-radius:50%;background:#C9D6E6;flex:none}
.lm-av.me{background:#F2D1B8}
.lm-av.xl{width:70px;height:70px}
.lm-pop{position:absolute;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:3;padding:4px}
.lm-pop.top{top:44px;right:8px}
.lm-pop.wide{left:8px}
.lm-pop.inline{position:static;align-self:flex-end;display:flex;flex-direction:column;margin-top:-2px}
.lm-pi{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:11px;border-radius:8px}
.lm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.lm-grid.pad{grid-template-columns:repeat(3,1fr);padding:14px 8px}
.lm-grid span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px}
.lm-grid i{font-style:normal;font-size:9px}
.lm-call{flex:1;background:#2B3542;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:36px;position:relative}
.lm-call.v{background:#5d6f7f;padding-top:0}
.lm-call small{opacity:.8}
.lm-face.big{position:absolute;inset:0 0 34% 0;background:radial-gradient(circle at 50% 45%,#F2D1B8 0 22%,#7E97AE 23%)}
.lm-face.small{position:absolute;top:12px;right:10px;width:48px;height:70px;border-radius:8px;border:2px solid #fff;background:radial-gradient(circle at 50% 45%,#F7DCC8 0 30%,#9BB9DB 31%)}
.lm-cbtns{position:absolute;bottom:62px;left:0;right:0;display:flex;justify-content:space-around}
.lm-cbtns span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;border-radius:10px}
.lm-cbtns span svg{width:22px;height:22px;background:rgba(255,255,255,.2);border-radius:50%;padding:7px;box-sizing:content-box}
.lm-cbtns i{font-style:normal;font-size:8.5px}
.lm-end{position:absolute;bottom:14px;left:calc(50% - 20px);width:40px;height:40px;border-radius:50%;background:#E5463B;display:grid;place-items:center;color:#fff}
.lm-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;flex:1;align-content:start}
.lm-photos span{aspect-ratio:1;position:relative;border-radius:2px}
.lm-photos span.sel{outline:2px solid #06C755;outline-offset:-2px}
.lm-photos span i{position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:#06C755;color:#fff;font-style:normal;font-size:9px;display:grid;place-items:center}
.lm-photos.few{grid-template-columns:repeat(4,1fr);flex:none;padding:0 10px}
.lm-bottom{display:flex;justify-content:flex-end;padding:8px 10px 12px;border-top:1px solid #e6e6e6}
.lm-btn{background:#06C755;color:#fff;border-radius:14px;padding:5px 12px;font-weight:700}
.lm-btn.sm{padding:3px 10px}
.lm-empty{flex:1;display:grid;place-items:center;color:#999}
.lm-fab{position:absolute;right:14px;bottom:18px;width:40px;height:40px;border-radius:50%;background:#06C755;color:#fff;display:grid;place-items:center}
.lm-fab.lm-hl{background:#06C755}
.lm-stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:#F6F6F6;flex:1;align-content:start}
.lm-st{aspect-ratio:1;border-radius:50%;background:hsl(var(--h,40) 70% 80%);position:relative}
.lm-st::after{content:"";position:absolute;inset:30% 25% 35%;border-bottom:2px solid #333;border-radius:0 0 50% 50%}
.lm-st.big{width:60px;display:block;--h:0}
.lm-prev{align-self:center;padding:6px;border-radius:12px}
.lm-set{display:flex;flex-direction:column}
.lm-set div{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid #eee;border-radius:6px}
.lm-set span{color:#aaa}
.lm-qr{flex:1;background:#222;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lm-qrbox{width:90px;height:90px;border:3px solid #06C755;border-radius:10px;display:grid;place-items:center;color:#fff}
.lm-qrbox svg{width:60px;height:60px}
.lm-found{background:#fff;color:#222;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.lm-myqr{font-size:10px;opacity:.8;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:3px 10px}
.lm-dim{position:absolute;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:4}
.lm-dialog{background:#fff;border-radius:12px;width:80%;padding:12px 10px 6px;text-align:center}
.lm-dialog div{display:flex;justify-content:space-around;margin-top:8px}
.lm-dialog span{padding:6px 8px;color:#06A840;font-weight:700;border-radius:8px}
.lm-call .lm-hl{background:rgba(255,255,255,.18)}
.lm-field{min-width:0;white-space:nowrap;overflow:hidden}
</style>

function detectDevice() {
  const ua = navigator.userAgent || '';
  if (/iPhone|iPod/.test(ua)) return 'iphone';
  if (/Android/.test(ua)) {
    if (/F-(42A|52B|53E|01L|03K|04J|01H|06F|12D|08E|09E|55F)/i.test(ua) || /raku/i.test(ua)) return 'raku';
    return 'android';
  }

}

/* ---- AI（Claude）につなぐ ---- */
/* Claudeの外で使うAIの中継先（Cloudflare Workers AI・無料枠）。空にするとAIは使いません */
const AI_ENDPOINT = 'https://buddies-ai.buddies-ai.workers.dev';
/* Claudeの sample と同じ使い方ができる形で、中継先を呼ぶ */
function workerSample() {
  const call = async (input, opts, json) => {
    const o = opts || {};
    const messages = typeof input === 'string' ? [{ role: 'user', content: input }] : input.map((t) => ({ role: t.role, content: String(t.content) }));
    const image = o.images && o.images[0] ? await shrinkImage(o.images[0]).catch(() => { throw { code: 'image_rejected' }; }) : null;
    let res;
    try {
      res = await fetch(AI_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages, image, json }), signal: o.signal });
    } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'network' }; }
    const d = await res.json().catch(() => ({}));
    if (res.status === 429) throw { code: 'rate_limited', why: d.code };
    if (!res.ok || typeof d.text !== 'string') throw { code: d.code || 'ai_error' };
    return d.text;
  };
  const fn = async (input, opts) => ({ text: await call(input, opts, false), truncated: false });
  fn.json = async (input, opts) => {
    const t = await call(input, opts, true);
    try { return JSON.parse(t); } catch (e) {}
    const m = t.match(/\{[\s\S]*\}/); // 前後に余計な文が付いたとき
    if (m) try { return JSON.parse(m[0]); } catch (e) {}
    throw { code: 'invalid_json' };
  };
  fn.limits = async () => ({ images: true });
  return fn;
}
/* 写真は長い辺1024pxのJPEGに小さくしてから送る（速く、通信量も少なく） */
function shrinkImage(file) {
  return new Promise((ok, ng) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ng(new Error('image')); };
    img.src = url;
  });
}

/* いちばん自然に聞こえる日本語の声を選ぶ */
function jaVoices() { try { return speechSynthesis.getVoices().filter((v) => /^ja/i.test(v.lang) || /日本語|Japanese/i.test(v.name)); } catch (e) { return []; } }
function voiceScore(v) {
  let n = 0;
  if (/Premium|Enhanced|拡張|高品質|Natural|Neural|Online/i.test(v.name)) n += 50;
  if (/Kyoko|O-?ren|Otoya|Hattori|Nanami|Keita|Mayu|Aoi|Google/i.test(v.name)) n += 25;
  if (/Siri/i.test(v.name)) n += 20;
  if (/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bells|Bubbles|Trinoids|Zarvox|Whisper|Bad News|Good News|Jester|Organ|Cellos|Boing|Bahh|Albert|Superstar|Wobble/i.test(v.name)) n -= 60;
  return n;
}
const MALE = /Otoya|Hattori|Keita|Daichi|Naoki|Ichiro|男性|Male/i;
const FEMALE = /Kyoko|O-?ren|Nanami|Mayu|Aoi|Shiori|Haruka|Ayumi|Sayaka|Nozomi|女性|Female/i;
/* キャラごとに、なるべく別々の声を割りあてる */
function voiceMap() {
  const vs = jaVoices().filter((v) => voiceScore(v) > -30).sort((a, b) => voiceScore(b) - voiceScore(a));
  const map = {}, used = new Set();
  if (!vs.length) return map;
  const own = S.settings.voices || {};
  for (const id of Object.keys(CHARS)) { const f = own[id] && vs.find((v) => v.name === own[id]); if (f) { map[id] = f; used.add(f.name); } }
  for (const id of Object.keys(CHARS)) {
    if (map[id]) continue;
    const cv = CHARS[id].voice;
    const free = vs.filter((v) => !used.has(v.name));
    const byHint = cv.hints.map((h) => free.find((v) => v.name.includes(h))).find(Boolean);
    const byGender = free.find((v) => (cv.g === 'm' ? MALE : FEMALE).test(v.name));
    const pick = byHint || byGender || free.find((v) => !(cv.g === 'm' ? FEMALE : MALE).test(v.name)) || free[0] || vs[0];
    map[id] = pick; used.add(pick.name);
  }
  return map;
}
function pickVoice(id) { return voiceMap()[id || S.settings.char] || null; }

function speak(text, force, who) {

  if (!S.settings.speak && !force) return;
  try {
    speechSynthesis.cancel();
    const id = who || S.settings.char, cv = CHARS[id].voice;
    const v = pickVoice(id);
    // 文ごとに区切って、息つぎのような間を入れる
    const parts = yomi(text).split(/(?<=[。！？!?])/).map((p) => p.trim()).filter((p) => p && p !== '、');
    const el = document.querySelector('.hero .who');
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = 'ja-JP'; u.rate = [0.72, 0.92, 1.12][S.settings.rate] * cv.rate; u.pitch = cv.pitch; u.volume = 1;
      if (v) u.voice = v;
      if (i === 0) u.onstart = () => { el && el.classList.add('talking'); speakingEl = el; };
      if (i === parts.length - 1) u.onend = () => { speakingEl && speakingEl.classList.remove('talking'); };
      u.onerror = () => { speakingEl && speakingEl.classList.remove('talking'); };
      speechSynthesis.speak(u);
    });
  } catch (e) {}
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) {} document.querySelectorAll('.talking').forEach((e) => e.classList.remove('talking')); }

/* ---- 用語に下線 ---- */
const TERM_RE = new RegExp(Object.keys(GLOSSARY).sort((a, b) => b.length - a.length).map((t) => t.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&')).join('|'), 'g');
function gloss(text) {
  const used = new Set();
  return esc(text).replace(TERM_RE, (m) => {
    if (used.has(m)) return m; used.add(m);
    return `<button class="term" data-act="term" data-term="${esc(m)}">${m}</button>`;
  });
}

function guideData(p) {

  const g = GUIDES[p.key];

}
V.guide = (p) => {
  const g = guideData(p);
  p.i = p.i || 0; p.dk = p.dk || 0;
  if (p.i === -1 && !g.before) p.i = 0;

  const st = intro ? null : g.steps[p.i];
  const dev = DEVICES[S.settings.device];
  const meta = `<div class="stepmeta"><span class="pill">${esc(p.custom && p.custom.src === 'ai' ? '相棒の案内' : (p.key && GUIDES[p.key] && GUIDES[p.key].line) ? 'LINEの手順（iPhone・Android共通）' : dev.name + 'の手順')}</span>${p.custom && p.custom.src === 'ai' ? '' : `<span>確認日：${CHECKED}</span>`}</div>`;

    <div class="stack"><button class="btn primary" data-act="gstart">わかりました。はじめる</button></div>`;
  }

  return `${topbar(g.title)}${meta}
  <div class="stepmeta"><span class="stepno">ステップ ${p.i + 1} / ${n}</span><span class="dots">${g.steps.map((_, i) => `<i class="${i <= p.i ? 'on' : ''}"></i>`).join('')}</span></div>

  let d = new Date(x.date + 'T00:00:00'); const today = new Date(); today.setHours(0, 0, 0, 0);

  while (d < today && guard++ < 400) { if (x.cycle === 'year') d.setFullYear(d.getFullYear() + 1); else d.setMonth(d.getMonth() + 1); }
  return d;
}

    /* サブスク */
    case 'subsvc': {
      const sv = SERVICES.find((x) => x.id === t.dataset.id);
      if (!sv) { go('subPick'); break; }
      if (sv.routes.length === 1) startSub(sv.id, sv.routes[0]); else go('subRoute', { id: sv.id });
      break;
    }
    case 'subgo': startSub(t.dataset.id, t.dataset.r); break;
    case 'subunk': go('subUnknown', { id: t.dataset.id }); break;
    /* 相談 */
    case 'askex': { const q = document.getElementById('q'); if (q) q.value = t.dataset.v; break; }
    case 'asksend': {
      const q = (document.getElementById('q') || {}).value || '';
      if (!q.trim()) { toast('困っていることを書いてください'); break; }
      askAI(q.trim()); break;
    }
    case 'askfollow': askAI(t.dataset.v); break;
    case 'askstop': if (c.ctl) c.ctl.abort(); break;
    case 'askagain': replace('ask', { q: '' }); break;
    case 'reask': { const h = S.history[+t.dataset.i]; go('ask', { q: h.q }); break; }
    case 'aiguide': {
      const r = c.res;
      go('guide', { custom: { src: 'ai', title: r.title || '相談の案内', conclusion: r.conclusion, undo: r.undo, steps: r.steps } });
      break;
    }
    /* 写真 */
    case 'photosend': askPhoto(((document.getElementById('pq') || {}).value || '').trim()); break;
    case 'photostop': if (c.ctl) c.ctl.abort(); break;
    case 'photonew': clearPhoto(); replace('photo', {}); break;
    case 'photochat': {
      // 写真の答えを最初のやりとりにして、文字で続けて相談する（写真そのものは送り直さない）
      const r = c.res, q = '（写真を見せて）' + (c.q || 'これは何？');
      const res = { kind: r.danger >= 2 ? 'danger' : 'answer', conclusion: String(r.what || ''), explain: [...(r.explain || []), ...(r.next ? [String(r.next)] : [])].slice(0, 3), steps: [] };
      go('ask', { base: basePrompt(q + `\n（写真に写っていたもの：${res.conclusion}。${res.explain.join('')}）`), chat: [{ q, res }], res });
      break;
    }
    /* あやしい連絡 */
    case 'scampre': logHist('あやしい連絡：' + SCAM_PRESETS.find((x) => x.id === t.dataset.id).label, { kind: 'scam' }); go('scamResult', { preset: t.dataset.id }); break;
    case 'scamcheck': {
      const v = ((document.getElementById('st') || {}).value || '').trim();
      if (!v) { toast('届いた文を書いてください'); break; }
      c.text = v; logHist('あやしい連絡チェック', { kind: 'scam' }); go('scamResult', { text: v }); break;
    }
    case 'scamai': scamAI(); break;
    /* サブスク一覧 */
    case 'cyc': c.cycle = t.dataset.v; keepSubForm(c); render(); break;
    case 'subsave': {
      keepSubForm(c);
      const price = parseInt(String(c.price || '').replace(/[^\d]/g, ''), 10);
      if (!c.name) { toast('サービスの名前を書いてください'); break; }
      if (!price) { toast('金額を数字で書いてください'); break; }
      S.subs.push({ name: c.name, price, cycle: c.cycle || 'month', date: c.date || '' }); save(); back(); toast('追加しました'); break;
    }
    case 'subdel': c.del = +t.dataset.i; render(); break;
    case 'subdel0': c.del = null; render(); break;
    case 'subdel2': S.subs.splice(+t.dataset.i, 1); c.del = null; save(); render(); toast('一覧から消しました'); break;
    /* 履歴・家族 */
    case 'histclear': S.history = []; save(); render(); toast('履歴を消しました'); break;
    case 'famsave': readFamily(); save(); c.edit = false; render(); toast('保存しました'); break;
    case 'famedit': c.edit = true; render(); break;
    case 'copymsg': {
      const txt = familyMsg();
      try { navigator.clipboard.writeText(txt).then(() => toast('コピーしました'), () => selectMsg()); } catch (err) { selectMsg(); }
      break;
    }
  }
});
function selectMsg() { const el = document.getElementById('fmsg'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('文を選びました。「コピー」を押してください'); }
function readFamily() {
  const n = document.getElementById('fname'), ph = document.getElementById('fphone');
  if (n) S.settings.family.name = n.value.trim(); if (ph) S.settings.family.phone = ph.value.trim();
}
function keepSubForm(c) {
  const g = (id) => (document.getElementById(id) || {}).value;
  c.name = (g('sn') || '').trim(); c.price = g('sp') || ''; c.date = g('sd') || '';
}
function startGuide(k) {
  const g = GUIDES[k]; if (!g) return;
  logHist(g.title, { key: k });
  go('guide', { key: k, i: g.before ? -1 : 0 });
}
function startSign(id, r) {
  const sv = SERVICES.find((x) => x.id === id);
  const n = id === 'other' ? '申し込みたいサービス' : id === 'docomoopt' ? '申し込みたいオプション' : sv.name.replace(/（.*）/, '');
  const steps = r === 'web' && SIGN_WEB[id] ? SIGN_WEB[id] : SIGN_STEPS[r](n);
  const title = `${id === 'other' ? 'サブスク' : n}に申し込む`;
  logHist(title, { kind: 'sign' });
  go('guide', { i: -1, custom: { src: 'data', title, conclusion: '申し込めます。一緒に進めましょう。', before: SIGN_BEFORE, undo: 'やめたいときは、ホームの「サブスクのこと」→「やめたい」から解約できます。', steps,
    after: { label: '契約中のサブスクに書いておく', v: 'subAdd', name: id === 'other' || id === 'docomoopt' ? '' : n, note: '金額と、次の支払い日（無料体験なら終わる日）を書いておくと、うっかり払い続けるのを防げます。' } } });
}
function startTv(id) {
  const m = TV_METHODS.find((x) => x.id === id);
  const steps = m.steps || m.stepsBy[S.settings.device === 'iphone' ? 'iphone' : 'other'];
  logHist(m.title, { kind: 'tv' });
  go('guide', { custom: { src: 'data', title: m.title, conclusion: m.conclusion, undo: m.undo, steps } });
}
function startSub(id, r) {
  const sv = SERVICES.find((x) => x.id === id);
  const n = sv.id === 'other' ? 'やめたいサービス' : sv.id === 'docomoopt' ? 'やめたいオプション' : sv.name;
  const steps = r === 'web' ? sv.web : ROUTE_STEPS[r](n);
  const title = `${sv.id === 'other' ? 'サブスク' : sv.name.replace(/（.*）/, '')}をやめる`;
  logHist(title, { kind: 'sub' });
  go('guide', { custom: { src: 'data', title, conclusion: 'やめられます。一緒に進めましょう。', undo: 'また使いたくなったら、もう一度申し込めば使えます。', steps } });
}
async function scamAI() {
  const c = cur(); if (!sampleFn) return;
  c.busy = true; render();
  try {
    const r = await sampleFn.json(`あなたは、スマホが苦手な70歳前後の方を助けるアプリ「Buddies」の案内役「${C().full}」です。
${rulesText()}
利用者に届いた次の連絡が、詐欺やあやしいものかどうか、やさしく見立ててください。
連絡の文:「${String(c.text).slice(0, 1500)}」
次の形のJSONだけを返してください: {"conclusion":"見立てを一言(40文字以内)","explain":["理由や対処(最大3文、1文40文字以内)"]}
あやしい場合は、押さない・払わない・家族に相談、を伝える。確かでないときは、公式の窓口で確かめるよう伝える。`);
    c.ai = { conclusion: String(r.conclusion || ''), explain: Array.isArray(r.explain) ? r.explain.map(String).slice(0, 3) : [] };
  } catch (e) { if (e && e.code === 'not_granted') sampleFn = null; toast('うまく見られませんでした'); }
  c.busy = false; render();
}

if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { if (cur().v === 'settings') render(); }; } catch (e) {} }
render();

</script>
